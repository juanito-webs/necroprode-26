        .tab-btn { padding: 12px 20px; border: 4px solid var(--black); cursor: pointer; background: var(--white); box-shadow: 4px 4px 0px var(--black); text-transform: uppercase; font-size: 0.8rem; font-family: 'Arial Black', sans-serif; }

        .search-wrapper { width: 100%; margin-bottom: 30px; }
        input { width: 100%; padding: 18px; font-size: 1.1rem; border: 5px solid var(--black); box-shadow: var(--shadow); outline: none; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        .result-card { background: var(--white); border: 6px solid var(--black); width: 100%; box-shadow: 15px 15px 0px var(--black); display: none; }
        .card-header { background: var(--black); color: var(--white); padding: 15px; font-size: 1.4rem; text-align: center; text-transform: uppercase; }
        .card-content { padding: 20px; }
        .list-title { font-size: 0.75rem; color: #555; margin-top: 15px; border-bottom: 2px solid var(--black); padding-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .item-list { list-style: none; padding: 0; margin: 10px 0; font-size: 1rem; }
        .item-list li { padding: 6px 0; border-bottom: 1px dashed #ccc; display: flex; justify-content: space-between; }
        .points-badge { background: var(--accent); padding: 20px; text-align: center; border-top: 6px solid var(--black); font-size: 2.2rem; }
        .data-meta { font-size: 1.1rem; margin-bottom: 10px; }
        
        /* Estilos de la Tabla de Posiciones */
        .table-container { width: 100%; max-width: 600px; display: none; background: var(--white); border: 6px solid var(--black); box-shadow: 15px 15px 0px var(--black); overflow-x: auto; }
        .pos-table { width: 100%; border-collapse: collapse; text-align: center; }
        .pos-table th { background: #00FFFF; padding: 15px 10px; border-bottom: 6px solid var(--black); border-right: 3px solid var(--black); text-transform: uppercase; font-size: 0.9rem; }
        .pos-table th:last-child, .pos-table td:last-child { border-right: none; }
        .pos-table td { padding: 12px 10px; border-bottom: 3px solid var(--black); border-right: 3px solid var(--black); font-size: 0.95rem; font-family: sans-serif; font-weight: 900; }
        .pos-table tr:last-child td { border-bottom: none; }
        .pos-table td:nth-child(2) { text-align: left; } /* Alinea los nombres a la izquierda */
    </style>

            if (val.length < 2) { res.style.display = 'none'; return; }

            if (mode === 'famosos') {
                const f = famosos.find(i => i.n.toLowerCase().includes(val));
                if (f) {
                    res.style.display = 'block';
                    document.getElementById('resNom').innerText = f.n;
                    document.getElementById('resMeta').innerHTML = `EDAD: ${f.e} AÑOS<br>PARTICIPACIONES: ${f.p}`;
                    document.getElementById('resTit').innerText = "Lo pusieron:";
                    
                    const elegidaPor = part.filter(p => p.l.includes(f.n)).map(p => p.n);
                    document.getElementById('resList').innerHTML = elegidaPor.length ? elegidaPor.map(p => `<li>${p}</li>`).join('') : "<li>Nadie lo puso</li>";
                    
                    document.getElementById('resPts').innerText = `PTS: ${f.pts}`;
                    document.getElementById('resPts').style.display = 'block';
                }
            } else if (mode === 'participantes') {
                const p = part.find(i => i.n.toLowerCase().includes(val));
                if (p) {
                    res.style.display = 'block';
                    document.getElementById('resNom').innerText = p.n;
                    document.getElementById('resMeta').innerHTML = `LISTA DE PARTICIPANTE`;
                    document.getElementById('resTit').innerText = "Sus famosos elegidos:";
                    
                    document.getElementById('resList').innerHTML = p.l.map(nomF => `<li>${nomF}</li>`).join('');
                    document.getElementById('resPts').style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
